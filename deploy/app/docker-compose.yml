# Domain Engine app on the VPS. Joins:
#  - the Traefik network (TRAEFIK_NETWORK in .env, n8n_default by default) for HTTPS on APP_HOST
#  - supabase_default to reach Postgres (db) and Auth (api-gw)
# Settings come from .env next to this file (see .env.example).

services:
  web:
    build:
      context: ../..
    image: domain-engine:latest
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    environment:
      NODE_ENV: production
    networks: [traefik, supabase]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-n8n_default}
      - traefik.http.routers.domainengine.rule=Host(`${APP_HOST:?set APP_HOST in .env}`)
      - traefik.http.routers.domainengine.entrypoints=web,websecure
      - traefik.http.routers.domainengine.tls=true
      - traefik.http.routers.domainengine.tls.certresolver=mytlschallenge
      - traefik.http.services.domainengine.loadbalancer.server.port=3000

  # Background jobs: Smartlead sync, daily stats, health rules, retiring.
  worker:
    build:
      context: ../..
      target: builder
    image: domain-engine-builder:latest
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["npx", "tsx", "scripts/worker.ts"]
    stop_grace_period: 15s
    networks: [supabase]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-off: docker compose run --rm migrate
  migrate:
    build:
      context: ../..
      target: builder
    image: domain-engine-builder:latest
    profiles: ["tools"]
    env_file: .env
    command: ["npx", "tsx", "scripts/migrate.ts"]
    networks: [supabase]

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-n8n_default}
    external: true
  supabase:
    name: supabase_default
    external: true
